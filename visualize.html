<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GraphMemory — graph visualizer</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#0b1220; color:#e6edf3; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  p { margin:0; color:#9fb0c3; font-size:13px; }
  canvas { display:block; width:100vw; height:calc(100vh - 60px); }
</style>
</head>
<body>
<header>
  <h1>GraphMemory visualizer</h1>
  <p>Load a JSON export (<code>python cli.py export graph.json</code>) —
  or just open this file after exporting next to it as <code>graph.json</code>.</p>
  <input type="file" id="file" accept=".json">
</header>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let graph = { nodes: [], edges: [] };

function draw() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.max(80, Math.min(W, H) / 2 - 90);
  const pos = new Map();
  graph.nodes.forEach((n, i) => {
    const a = (i / Math.max(1, graph.nodes.length)) * Math.PI * 2 - Math.PI / 2;
    pos.set(n.name, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), kind: n.kind });
  });
  ctx.font = '11px system-ui';
  for (const e of graph.edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    ctx.strokeStyle = 'rgba(120,160,220,.45)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.fillStyle = '#8fa8c8';
    ctx.fillText(e.relation, (a.x + b.x) / 2 + 4, (a.y + b.y) / 2 - 4);
  }
  for (const [name, p] of pos) {
    ctx.fillStyle = '#1f6feb';
    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#9ec1ff'; ctx.stroke();
    ctx.fillStyle = '#e6edf3'; ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center'; ctx.fillText(name, p.x, p.y - 24);
    ctx.font = '10px system-ui'; ctx.fillStyle = '#9fb0c3';
    ctx.fillText(p.kind || '', p.x, p.y + 28);
    ctx.textAlign = 'left';
  }
}
async function boot() {
  try {
    const r = await fetch('graph.json');
    if (r.ok) { graph = await r.json(); draw(); return; }
  } catch (e) { /* file:// or not exported yet */ }
  graph = { nodes: [
    { name: 'Panji', kind: 'person' }, { name: 'GraphMemory', kind: 'project' },
    { name: 'Relate', kind: 'tool' }, { name: 'Neo4j', kind: 'organization' },
  ], edges: [
    { from: 'Panji', to: 'GraphMemory', relation: 'builds' },
    { from: 'GraphMemory', to: 'Relate', relation: 'built_on' },
    { from: 'Relate', to: 'Neo4j', relation: 'made_by' },
  ] };
  draw();
}
document.getElementById('file').addEventListener('change', async (ev) => {
  graph = JSON.parse(await ev.target.files[0].text()); draw();
});
window.addEventListener('resize', draw);
boot();
</script>
</body>
</html>
